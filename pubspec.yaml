name: lyberry
description: "Lyberry - offline physical media collection tracker."
publish_to: 'none'

# versionName / versionCode on Android, CFBundleShortVersionString / Bundle version on iOS.
version: 0.7.0+9

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  file_picker: ^13.1.0
  image: ^4.5.4
  image_picker: ^1.1.2
  mobile_scanner: ^7.4.2
  path: ^1.9.0
  sqflite: ^2.4.2
  sqflite_common: ^2.5.4+6
  uuid: ^4.5.1
  flutter_secure_storage: ^11.0.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Used only by the photo-source unit test to stub the picker platform.
  image_picker_platform_interface: ^2.11.1
  # Used only by the secure-storage unit test to stub the keystore platform.
  flutter_secure_storage_platform_interface: ^2.1.1
  sqflite_common_ffi: ^2.3.5
  # Test-only SQLite binding. The 3.x line runs a Dart native-assets build hook
  # that shells out to `dart compile kernel`; 2.x loads the system SQLite, which
  # is what `flutter test` needs here. The app itself uses sqflite on device.
  sqlite3: ^2.6.0

flutter:
  uses-material-design: true

  fonts:
    # Oxanium (SIL OFL 1.1), bundled from the official Google Fonts repository.
    # Variable font: weights are selected through FontVariation('wght', ...).
    - family: Oxanium
      fonts:
        - asset: assets/fonts/oxanium/Oxanium-Variable.ttf
